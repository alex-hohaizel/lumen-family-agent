services:
  db:
    image: postgres:17-bookworm
    env_file: ./runtime/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    logging:
      options: { max-size: "5m", max-file: "2" }
  bot:
    # The pinned Chromium npm package contains Linux x64 binaries. ARM hosts
    # require their Docker engine's amd64 emulation support.
    platform: linux/amd64
    build: .
    user: "${LUMEN_UID:-1000}:${LUMEN_GID:-1000}"
    volumes:
      - ./runtime:/app/runtime
    depends_on:
      db: { condition: service_healthy }
    environment:
      HEALTH_PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 240s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    # Chromium alone expands to >200 MB; it must execute from this mount.
    # This is a cap, not a reservation. Account for tmpfs usage in host RAM.
    tmpfs: ["/tmp:rw,exec,nosuid,nodev,size=1g,mode=1777"]
    logging:
      options: { max-size: "5m", max-file: "2" }
  setup:
    platform: linux/amd64
    build: .
    profiles: ["tools"]
    user: "${LUMEN_UID:-1000}:${LUMEN_GID:-1000}"
    volumes:
      - ./runtime:/app/runtime
    environment:
      SETUP_CONTAINER: "true"
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:1455:1455"
    command: ["node", "dist/src/setup.js"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  backups:
    image: postgres:17-bookworm
    env_file: ./runtime/postgres.env
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ["bash", "/backup-loop.sh"]
    restart: unless-stopped
    logging:
      options: { max-size: "2m", max-file: "2" }
volumes:
  postgres_data:
