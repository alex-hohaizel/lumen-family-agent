name: Verify Lumen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install PDF test utility
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci --include=dev --no-audit --no-fund
      # One complete functional gate, followed by checks of the actual runtime
      # package. Render builds the same commit without repeating the suite.
      - run: npm run verify
      - name: Select container checks for changed runtime packaging
        id: runtime_image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release/image-changes.mjs
      - name: Build curated runtime image
        if: steps.runtime_image.outputs.required == 'true'
        run: docker build --build-arg LUMEN_BUILD_REVISION="${{ github.sha }}" --tag lumen-runtime:verify .
      - name: Verify packaged media in the restricted container
        if: steps.runtime_image.outputs.required == 'true'
        run: >-
          docker run --rm --read-only --network none
          --memory 512m --memory-swap 512m --cpus 0.5
          --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true
          --mount type=bind,src="${{ github.workspace }}/tools/release",dst=/verify,readonly
          --env GITHUB_SHA="${{ github.sha }}"
          --env LUMEN_VERIFY_RESOURCE_LIMITS=true
          --entrypoint node lumen-runtime:verify /verify/verify.mjs /app
