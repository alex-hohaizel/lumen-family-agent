# All credentials are provided through Render secrets, never committed here.
services:
  - type: worker
    name: lumen-family-agent
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm test && npm prune --omit=dev
    startCommand: npm start
    disk:
      name: lumen-credentials
      mountPath: /var/data/lumen
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NODE_ENV
        value: production
      - key: RUNTIME_DIR
        value: /var/data/lumen
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-family-memory
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LUMEN_PAIRING_CODE
        generateValue: true
      - key: AUTH_MODE
        value: chatgpt
      # Legacy/onboarding default only. For the 1.13 joint release, enable true
      # only after its complete approved 120-asset commit is available remotely.
      # Do not deploy the current preparation or activate a code-only release.
      - key: LUMEN_REQUIRE_VERIFIED_STICKER_PACK
        value: "false"
      - key: TIMEZONE
        value: Europe/Kyiv
      - key: OPENAI_MODEL
        sync: false
databases:
  - name: lumen-family-memory
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: lumen
    user: lumen
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
